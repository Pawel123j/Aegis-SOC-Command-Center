[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-soc-backend"
version = "0.1.0"
description = "Aegis SOC Command Center backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "idna==3.20",
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "PyYAML==6.0.3",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<7",
  "SQLAlchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "colorama==0.4.6",
  "httpx2>=2.0,<3",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pip-tools>=7.4,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires real PostgreSQL, Redis and ClickHouse services"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
