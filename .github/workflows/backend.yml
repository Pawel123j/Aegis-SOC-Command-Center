name: Backend foundation

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Frontend locked install, quality and static build
        run: >-
          docker run --rm -e CI=true -v "$PWD/frontend:/workspace" -w /workspace
          node:24.19.0-bookworm-slim sh -ec
          'npm install --global pnpm@11.19.0 &&
          pnpm install --frozen-lockfile --ignore-scripts &&
          pnpm build && pnpm lint && pnpm format && pnpm test && pnpm audit'
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.14"
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python scripts/validate_repository.py
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: mypy
        working-directory: backend
      - run: pytest -m "not integration" --cov=app
        working-directory: backend
      - run: pip-audit -r backend/requirements.lock --strict --require-hashes

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.14"
      - run: python scripts/bootstrap_env.py
      - name: Build the panel served by the integration proxy
        run: >-
          docker run --rm -e CI=true -v "$PWD/frontend:/workspace" -w /workspace
          node:24.19.0-bookworm-slim sh -ec
          'npm install --global pnpm@11.19.0 &&
          pnpm install --frozen-lockfile --ignore-scripts && pnpm build'
      - run: docker compose config --quiet
      - run: docker compose build api && docker compose --profile test build tests
      - run: docker compose up -d --wait
      - run: curl --fail --silent --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8080/health && curl --fail --silent --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8080/ready
      - run: docker compose --profile test run --rm tests
      - name: Service status on failure
        if: failure()
        run: docker compose ps --all
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
