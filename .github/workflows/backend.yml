name: Backend foundation

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python scripts/validate_repository.py
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: mypy
        working-directory: backend
      - run: pytest -m "not integration" --cov=app
        working-directory: backend
      - run: pip-audit -r backend/requirements.lock --strict --require-hashes

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python scripts/bootstrap_env.py
      - run: docker compose config --quiet
      - run: docker compose build api && docker compose --profile test build tests
      - run: docker compose up -d --wait
      - run: curl --fail --silent http://localhost:8080/health && curl --fail --silent http://localhost:8080/ready
      - run: docker compose --profile test run --rm tests
      - name: Service status on failure
        if: failure()
        run: docker compose ps --all
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
