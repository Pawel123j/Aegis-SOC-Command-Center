worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error records cannot redact request targets or headers. Keep request
# diagnostics in the application and publish only the allowlisted access log.
error_log /dev/null crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Request targets may contain credentials; log method/status/request-id only.
    log_format safe escape=json '{"method":"$request_method","status":$status,"request_id":"$upstream_http_x_request_id"}';
    access_log /dev/stdout safe;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Compose can replace the API with a different address during an update.
    # Resolve its service name again instead of retaining the startup address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream aegis_api {
        zone aegis_api 64k;
        server api:8000 resolve;
    }

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 1m;
        client_body_timeout 10s;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        location ^~ /metrics { return 404; }
        location ^~ /api/ {
            proxy_pass http://aegis_api;
        }
        location = /health { proxy_pass http://aegis_api; }
        location = /ready { proxy_pass http://aegis_api; }
        location /assets/ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
